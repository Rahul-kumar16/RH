<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>143 Heart Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="ui-container">
    <div id="heart-wrapper">
      <div id="heart">
        <!-- Text placed directly at the geometric center of the heart -->
        <div class="center-text">Always & Forever</div>
      </div>
    </div>
  </div>

  <!-- Music Trigger Button placed at Bottom Right -->
  <button id="music-btn" aria-label="Play Music">
    <span class="heart-icon">💖</span>
  </button>

  <!-- Audio Element -->
  <audio id="bg-music" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
